# Tests, type-check and build for UHD on its own, and the checks that keep
# every commit releasable: the version agrees with the changelog, and the
# package packs. Publishing is release.yml's, from a tag.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**", "mark/**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a push and the pull request from the same branch share
# a group, so the later one cancels the earlier. Fork pull requests group by
# their own repository.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  uhd:
    name: Test, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release check reads the release tags
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: The version agrees with the changelog
        run: node scripts/check-release.mjs --pr
      - name: The package packs
        run: npm pack --dry-run
