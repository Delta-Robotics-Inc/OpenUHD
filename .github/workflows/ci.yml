# Tests, type-check and build for UHD on its own.
name: CI

on:
  pull_request:
  push:
    branches: ["mark/**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a push and the pull request from the same branch share
# a group, so the later one cancels the earlier. Fork pull requests group by
# their own repository.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  uhd:
    name: Test, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test
      - run: npm run build
